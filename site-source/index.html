        },

    <!-- Fonts: Albert Sans (headings/UI) · Cormorant Garamond italic (drama) · IBM Plex Mono (data) -->
    <link rel="preload" as="font" type="font/woff2" href="/fonts/albert-sans-normal-400-800-latin.woff2" crossorigin />
    <link rel="preload" as="font" type="font/woff2" href="/fonts/cormorant-garamond-italic-400-600-latin.woff2" crossorigin />
    <link rel="stylesheet" href="/fonts/fonts.css" />

    <!-- Theme boot: apply saved / system theme before first paint to avoid flash -->
    <script>
      (function () {
        var t = localStorage.getItem('theme');
        var dark = t === 'dark' || (!t || t === 'system') && window.matchMedia('(prefers-color-scheme: dark)').matches;
        if (t === 'light') dark = false;
        document.documentElement.classList.toggle('dark', dark);
      })();
    </script>
